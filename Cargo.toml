[package]
name = "universal-translator"
version = "0.1.0"
edition = "2024"
description = "Source-preserving translation for small programs through a shared meta-language"
license = "Unlicense"
repository = "https://github.com/link-foundation/universal-translator"
include = [
    "/rust/src/**",
    "/data/**",
    "/rust/tests/**",
    "/examples/translation/**",
    "/examples/programs/**",
    "/examples/layout/**",
    "/examples/rules/**",
    "/examples/objpak/hello.m",
    "/examples/objpak/conditions.m",
    "/examples/printing/arithmetic.py",
    "/docs/case-studies/issue-14/data/hello-world-collection/programs.json",
    "/docs/case-studies/issue-14/hello-world-coverage.lino",
    "/README.md",
    "/LICENSE",
]

[lib]
path = "rust/src/lib.rs"

[[test]]
name = "concrete_syntax"
path = "rust/tests/concrete_syntax.rs"

[[bin]]
name = "universal-translator"
path = "rust/src/main.rs"

[dependencies]
meta-language = { version = "=1.0.0", default-features = false }
relative-meta-logic = { version = "=0.21.0", default-features = false, features = ["core"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
links-notation = { version = "=0.31.8", default-features = false }

[[test]]
name = "equivalence"
path = "rust/tests/equivalence.rs"

