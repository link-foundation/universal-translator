name: Example app

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'examples/universal-app/**'
      - 'js/src/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/update-preview-images.mjs'
      - 'scripts/setup-preview-gh.sh'
      - 'scripts/check-preview-tools.sh'
      - 'scripts/push-main-with-rebase-retry.mjs'
      - 'scripts/run-with-budget-warning.sh'
      - 'scripts/check-desktop-compat.mjs'
      - '.github/workflows/example-app.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/universal-app/**'
      - 'js/src/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/update-preview-images.mjs'
      - 'scripts/setup-preview-gh.sh'
      - 'scripts/check-preview-tools.sh'
      - 'scripts/push-main-with-rebase-retry.mjs'
      - 'scripts/run-with-budget-warning.sh'
      - 'scripts/check-desktop-compat.mjs'
      - '.github/workflows/example-app.yml'
  workflow_dispatch:

permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  web-build:
    name: Build web app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-web-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: examples/universal-app/package-lock.json

      - name: Install app dependencies
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix examples/universal-app --no-audit --no-fund

      - name: Build app
        run: npm run example:web:build
        env:
          GITHUB_PAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          VITE_REPOSITORY_URL: https://github.com/${{ github.repository }}

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: universal-example-web
          path: examples/universal-app/dist
          if-no-files-found: error

      - name: Explain GitHub Pages deployment skip
        if: github.event_name == 'pull_request'
        run: echo '::notice title=GitHub Pages deployment::The PR web build is available as an artifact. GitHub Pages deployment runs on pushes to main.'

      - name: Configure GitHub Pages
        id: configure-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Explain GitHub Pages configuration failure
        if: failure() && steps.configure-pages.conclusion == 'failure'
        run: |
          echo '::error title=GitHub Pages configuration::In Settings > Pages, set the build source to GitHub Actions. If Pages is already configured, review the Configure GitHub Pages step for the reported error.'

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: examples/universal-app/dist

  # Requires Settings → Pages → Source = GitHub Actions to be set once
  # in the repository before this job can succeed. See README → "Deploying
  # the example app". The Pages source cannot be configured from a workflow.
  pages-deploy:
    name: Deploy GitHub Pages
    needs: [web-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

  desktop-package:
    name: Package desktop app (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-desktop-package
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: examples/universal-app/package-lock.json

      - name: Install app dependencies
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix examples/universal-app --no-audit --no-fund

      # The overrides in examples/universal-app/package.json swap in
      # @electron/asar 4 and a native fs.rm adapter for temp's rimraf 2 (see
      # examples/universal-app/compat/README.md). Run the real consumers.
      - name: Verify desktop compatibility APIs
        run: node --pending-deprecation --throw-deprecation scripts/check-desktop-compat.mjs

      - name: Package Electron app
        shell: bash
        run: |
          npm run example:desktop:package
          for attempt in {1..30}; do
            echo "Waiting for the packaged app (attempt ${attempt}/30)"
            if [[ -d examples/universal-app/out ]] &&
              [[ -n "$(find examples/universal-app/out -mindepth 1 -print -quit)" ]]; then
              find examples/universal-app/out -maxdepth 2 -mindepth 1 -print
              exit 0
            fi
            sleep 1
          done
          echo "::error::Desktop package output was not created at examples/universal-app/out"
          exit 1
        env:
          VITE_REPOSITORY_URL: https://github.com/${{ github.repository }}

      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: universal-example-desktop-ubuntu-24.04
          path: examples/universal-app/out
          if-no-files-found: error

  android-build:
    name: Build Android app
    if: github.event_name == 'workflow_dispatch' && vars.EXAMPLE_APP_ENABLE_ANDROID_BUILD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-android-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: examples/universal-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install app dependencies
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix examples/universal-app --no-audit --no-fund

      - name: Add Android project
        run: npm --prefix examples/universal-app run mobile:android:add

      - name: Build Android project
        run: npm --prefix examples/universal-app run mobile:android:build

      - name: Upload Android output
        uses: actions/upload-artifact@v7
        with:
          name: universal-example-android
          path: |
            examples/universal-app/android/app/build/outputs/**/*.apk
            examples/universal-app/android/app/build/outputs/**/*.aab
          if-no-files-found: warn

  # Drive the translator demo in a real browser: languages are listed,
  # statements, programs and sentences translate, and an incomplete
  # fragment reports an error. The screenshot is uploaded for review.
  web-e2e:
    name: Web demo end-to-end
    runs-on: ubuntu-24.04
    container:
      # Same digest as preview-regen; keep both in sync with playwright below.
      image: mcr.microsoft.com/playwright@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53 # v1.59.1-noble
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-web-e2e
      cancel-in-progress: true
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install app dependencies
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix examples/universal-app --no-audit --no-fund

      # Pinned exactly and only used by this job, like preview-regen.
      - name: Install Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.59.1 # zizmor: ignore[adhoc-packages]

      - name: Build app
        run: npm run example:web:build

      - name: Translate in the browser
        run: |
          mkdir -p e2e-output
          npm --prefix examples/universal-app run preview -- --port 4173 --strictPort > e2e-output/preview.log 2>&1 &
          node examples/universal-app/e2e/translate.e2e.mjs http://127.0.0.1:4173/ e2e-output/web-demo.png

      # The desktop app opens dist/index.html from file://, where a skin once
      # failed to load; check it the same way.
      - name: Load a skin from file:// like the desktop app
        run: node examples/universal-app/e2e/file-protocol.e2e.mjs examples/universal-app/dist/index.html

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-demo-e2e
          path: e2e-output/
          if-no-files-found: ignore

  # Render the preview screenshots on pull requests in the same container
  # the main-branch writer uses. The writer runs only on main, so before this
  # job a broken page selector (the template's #calculator-title) merged
  # green and failed every later push to main. Nothing is committed here:
  # the rendered images are uploaded for review.
  preview-check:
    name: Check Preview Images
    runs-on: ubuntu-24.04
    container:
      # Same digest as preview-regen; keep both in sync with playwright below.
      image: mcr.microsoft.com/playwright@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53 # v1.59.1-noble
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-preview-check
      cancel-in-progress: true
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    # Container jobs run `run:` blocks with sh, which has no [[ ]].
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The container user (root) does not own the runner's workspace, so git
      # refuses the checkout as dubious ownership until it is trusted.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The writer needs gh for its push; check the same setup here so a
      # missing tool fails the pull request rather than main.
      - name: Install pinned GitHub CLI
        run: bash scripts/run-with-budget-warning.sh 120 "Pinned GitHub CLI setup" bash scripts/setup-preview-gh.sh

      - name: Check preview container tools
        run: bash scripts/check-preview-tools.sh

      - name: Install example app dependencies
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix examples/universal-app --no-audit --no-fund

      # Pinned exactly and only used by the preview jobs.
      - name: Install browser automation dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --no-audit --no-fund browser-commander@0.8.1 playwright@1.59.1 # zizmor: ignore[adhoc-packages]

      - name: Render preview images
        run: node scripts/update-preview-images.mjs

      - name: Report preview drift
        run: |
          # The assignment fails the step when git fails; a test on $(...)
          # would read the failure as no drift.
          changes="$(git status --porcelain -- docs/screenshots/example-app/)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            echo "::notice title=Preview images::This change renders different preview images. The main branch commits them after merge; the rendered images are in the example-app-preview-images artifact."
          else
            echo "Preview images already current."
          fi

      - name: Upload rendered preview images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-app-preview-images
          path: docs/screenshots/example-app/
          retention-days: 7
          if-no-files-found: error

  # Regenerate example-app preview screenshots (docs/screenshots/example-app/*)
  # using browser-commander + Playwright so README/site images always reflect
  # the current UI. Implementation: scripts/update-preview-images.mjs.
  preview-regen:
    name: Regenerate Preview Images
    runs-on: ubuntu-24.04
    container:
      # Keep this release in sync with the playwright package version below.
      # Pinned by digest (a mutable tag is arbitrary code execution in a job
      # that holds contents: write). Re-resolve when bumping:
      #   docker buildx imagetools inspect mcr.microsoft.com/playwright:<tag>
      image: mcr.microsoft.com/playwright@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53 # v1.59.1-noble
    timeout-minutes: 20
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    # Container jobs run `run:` blocks with sh, which has no [[ ]]: under sh
    # the drift test failed with "[[: not found" and reported no drift.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # Regenerate against main HEAD so the bot commit lands on a
          # fast-forward parent regardless of which trigger started the job.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      # The container user (root) does not own the runner's workspace, so git
      # refuses the checkout as dubious ownership until it is trusted.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Runner tools such as gh are not inherited by container jobs; the
      # commit step needs gh as its Git credential helper.
      - name: Install pinned GitHub CLI
        run: bash scripts/run-with-budget-warning.sh 120 "Pinned GitHub CLI setup" bash scripts/setup-preview-gh.sh

      - name: Check preview container tools
        run: bash scripts/check-preview-tools.sh

      - name: Install example app dependencies
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix examples/universal-app --no-audit --no-fund

      # Deliberately installed outside the lockfile: these tools are only used
      # by the preview jobs and both versions are pinned exactly.
      - name: Install browser automation dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false --no-audit --no-fund browser-commander@0.8.1 playwright@1.59.1 # zizmor: ignore[adhoc-packages]

      - name: Regenerate preview images
        id: regenerate
        run: node scripts/update-preview-images.mjs

      - name: Detect drift
        id: drift
        run: |
          # The assignment fails the step when git fails; a test on $(...)
          # would read the failure as no drift.
          changes="$(git status --porcelain)"
          if [[ -n "$changes" ]]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Preview images drifted:"
            printf '%s\n' "$changes"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Preview images already current."
          fi

      - name: Commit drift back to main
        id: commit
        if: steps.drift.outputs.drift == 'true'
        env:
          # The dedicated actor lets required pull_request checks run when a
          # ruleset sends this generated commit through the fallback PR.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PR_TOKEN" ]]; then
            echo "::error title=Preview images drifted::RELEASE_PR_TOKEN is required to push generated preview images. Either add a RELEASE_PR_TOKEN repository secret (Settings > Secrets and variables > Actions; Contents and Pull requests write access, Checks read access), or download the preview-regen-failure-${GITHUB_RUN_ID} artifact of this run, commit its files under docs/screenshots/example-app/ through a pull request, and rerun."
            exit 1
          fi
          # Configure gh as a step-scoped Git credential helper. The checkout
          # remains credential-free during dependency installation.
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only generated artifacts so unrelated changes can't leak in.
          # A staging failure must fail the step, not read as "nothing staged".
          git add -- docs/screenshots/example-app/
          if git diff --cached --quiet; then
            echo "::notice::No tracked preview-image changes to commit (drift was outside expected paths)."
            git status --porcelain
            exit 0
          fi
          # Screenshot-only pushes do not match this workflow's path filter.
          # Do not add [skip ci]: a fallback PR needs its required checks.
          git commit -m "chore(preview): regenerate example-app preview images"
          node scripts/push-main-with-rebase-retry.mjs origin main --label preview-images
          echo "landed=true" >> "$GITHUB_OUTPUT"

      - name: Upload screenshot failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-regen-failure-${{ github.run_id }}
          path: docs/screenshots/example-app/
          retention-days: 7
          if-no-files-found: error

      # One outcome, one message: report what actually happened instead of
      # claiming a commit that a failed step never made.
      - name: Summarize regeneration result
        if: always()
        env:
          REGENERATE: ${{ steps.regenerate.outcome }}
          DRIFT: ${{ steps.drift.outputs.drift }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          LANDED: ${{ steps.commit.outputs.landed }}
        run: |
          if [[ "$REGENERATE" != "success" ]]; then
            echo "Preview images were not regenerated (step outcome: ${REGENERATE:-not run})."
          elif [[ "$DRIFT_OUTCOME" != "success" ]]; then
            echo "Preview drift could not be checked (step outcome: ${DRIFT_OUTCOME:-not run})."
          elif [[ "$DRIFT" == "false" ]]; then
            echo "::notice::Preview images are already up to date."
          elif [[ "$COMMIT" == "success" && "$LANDED" == "true" ]]; then
            echo "::notice::Regenerated preview images were committed to main."
          else
            echo "Regenerated preview images differ but were not committed (commit outcome: ${COMMIT:-not run})."
          fi

  # Terminal status gate: runs even when the jobs above fail or are
  # cancelled, and turns a `timeout-minutes` kill (reported as cancelled)
  # into a red run. needs is derived and checked by the status-gate-coverage
  # job in workflows.yml.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    # A status function is required: without one the gate inherits the
    # implicit "every dependency succeeded" condition and is skipped in
    # exactly the runs it exists to report.
    if: >-
      !cancelled()
    needs:
      - web-build
      - pages-deploy
      - desktop-package
      - android-build
      - web-e2e
      - preview-check
      - preview-regen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
