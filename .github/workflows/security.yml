name: Security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Analyze every file, not only the lines a pull request touches, so the
    # result gate below sees the same alerts as the Security tab.
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ matrix.language }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results

      # The analyze step uploads alerts but passes whatever it finds, so a new
      # alert only showed up in the Security tab. Fail on findings and on
      # extractor warnings instead.
      - name: Require clean CodeQL results
        if: ${{ !cancelled() }}
        run: node scripts/check-codeql-results.mjs codeql-results

      - name: Preserve CodeQL reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: error

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # As in the JS template: the scorecard of every new dependency is
          # listed in the summary, but a low score is not a vulnerability, so
          # it does not raise a warning annotation. human-signals (through
          # command-stream and execa) scores 2.8 against the default 3.
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 0
          comment-summary-in-pr: on-failure

  npm-audit:
    name: Audit npm lock (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-npm-audit-${{ matrix.directory }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', examples/universal-app]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # `npm audit --audit-level=high` passed silently with moderate
      # advisories open. Every advisory is now annotated and listed in the
      # step summary; only `high` and above fail pull requests, so a moderate
      # advisory with no patched release cannot block every contributor. The
      # weekly run also fails on a moderate advisory that `npm audit fix`
      # resolves without --force.
      - name: Audit current lock
        working-directory: ${{ matrix.directory }}
        env:
          AUDIT_DIR: ${{ matrix.directory }}
          AUDIT_LEVEL: high
          AUDIT_FIXABLE_LEVEL: ${{ github.event_name == 'schedule' && 'moderate' || '' }}
        run: bash "$GITHUB_WORKSPACE/scripts/run-with-budget-warning.sh" 120 "npm security audit" node "$GITHUB_WORKSPACE/scripts/npm-audit-report.mjs"

      # The lockfile records deprecations known when it was written; this asks
      # the registry about each locked version. Pull requests get warnings,
      # the weekly run fails.
      - name: Check live npm deprecations
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.directory }}
        env:
          DEPRECATED_FAIL: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: bash "$GITHUB_WORKSPACE/scripts/run-with-budget-warning.sh" 120 "Live npm deprecation check" node "$GITHUB_WORKSPACE/scripts/check-deprecated-packages.mjs" package-lock.json

  # Terminal status gate: runs even when the jobs above fail or are
  # cancelled, and turns a `timeout-minutes` kill (reported as cancelled)
  # into a red run. needs is derived and checked by the status-gate-coverage
  # job in workflows.yml.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    # A status function is required: without one the gate inherits the
    # implicit "every dependency succeeded" condition and is skipped in
    # exactly the runs it exists to report.
    if: >-
      !cancelled()
    needs:
      - codeql
      - dependency-review
      - npm-audit
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
